<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A股资金流向大屏</title>
  <link rel="stylesheet" href="./styles.css?v=20260702-real-flow-only">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">A-SHARE FUND FLOW RADAR</div>
        <h1>A股盘中资金流向</h1>
      </div>
      <div class="market-meta" aria-label="行情状态">
        <div class="meta-chip">
          <span>交易日</span>
          <strong id="tradeDate">--</strong>
        </div>
        <div class="meta-chip">
          <span>当前时间</span>
          <strong id="clock">--:--:--</strong>
        </div>
        <div class="meta-chip status" id="sourceStatus">
          <span>数据源</span>
          <strong>初始化</strong>
        </div>
        <button class="ghost-btn" id="refreshBtn" type="button">刷新</button>
      </div>
    </header>

    <main class="dashboard-grid">
      <section class="chart-panel" aria-label="盘中资金流向曲线">
        <div class="panel-head">
          <div>
            <h2>盘中净流入轨迹</h2>
            <p id="chartSubtitle">09:30 至当前，单位：亿元</p>
          </div>
          <div class="chart-tools">
            <div class="segmented" id="chartMode" aria-label="曲线类型">
              <button class="active" type="button" data-mode="flow">资金图</button>
              <button type="button" data-mode="price">分时</button>
              <button type="button" data-mode="dual">同屏</button>
            </div>
            <label>
              <span>排序</span>
              <select id="sortMode">
                <option value="absolute">净额绝对值</option>
                <option value="inflow">净流入优先</option>
                <option value="outflow">净流出优先</option>
                <option value="rank">原始排名</option>
              </select>
            </label>
            <button class="ghost-btn" id="pauseBtn" type="button">暂停</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="flowCanvas" aria-label="资金流向折线图"></canvas>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>

        <div class="time-scrubber" id="timeScrubber" aria-label="盘中时间回看">
          <div class="time-scrubber-main">
            <strong id="timeScrubLabel">当前 --:--</strong>
            <input id="timeScrubRange" type="range" min="0" max="240" step="1" value="240" aria-label="选择盘中时间">
            <button id="timeNowBtn" type="button">当前</button>
          </div>
          <div class="time-scrubber-scale" aria-hidden="true">
            <span>09:30</span>
            <span>11:30</span>
            <span>15:00</span>
          </div>
        </div>

        <div class="mobile-board-strip" id="mobileBoardStrip" aria-label="重点大类资金标签"></div>

        <div class="scope-tabs" id="scopeTabs" aria-label="资金流分类筛选">
          <button class="active" type="button" data-scope="all">重点大类</button>
          <button type="button" data-scope="industry">行业</button>
          <button type="button" data-scope="concept">概念</button>
          <button type="button" data-scope="region">地域</button>
          <button type="button" data-scope="market">市场</button>
          <button type="button" data-scope="stock">个股</button>
          <button type="button" data-scope="northbound">北向</button>
        </div>
      </section>

      <aside class="side-panel" aria-label="资金排行榜与拆解">
        <section class="mini-card heartbeat-card">
          <div class="mini-title">刷新节奏</div>
          <div class="countdown"><span id="countdown">--</span><small>秒后请求</small></div>
          <p id="refreshHint">UI 每秒心跳，真实请求分层限流。</p>
        </section>

        <section class="mini-card">
          <div class="mini-title">净流入 Top</div>
          <ol class="rank-list" id="inflowList"></ol>
        </section>

        <section class="mini-card">
          <div class="mini-title">净流出 Top</div>
          <ol class="rank-list" id="outflowList"></ol>
        </section>

        <section class="mini-card">
          <div class="mini-title">大单拆解</div>
          <div class="breakdown-list" id="breakdownList"></div>
        </section>

        <section class="notice-card" id="noticeCard">
          <strong>数据说明</strong>
          <p>页面优先读取本地真实资金流接口；默认只展示行业/概念重点大类。</p>
        </section>
      </aside>
    </main>
  </div>

  <script src="./app.js?v=20260702-real-flow-only"></script>
</body>
</html>
